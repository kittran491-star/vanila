<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tem Phiếu Bí Mật</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#FFE7F0,#FFF8FB);
  color:#6b4b4b;
  overflow:hidden;
}
.screen{
  display:none;
  width:100vw;
  height:100vh;
  padding:24px;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.active{display:flex}
h1{
  color:#E45D8C;
  font-size:34px;
  text-align:center;
}
p{
  color:#8A6C6C;
  margin:12px 0 26px;
  text-align:center;
}
.btn{
  background:#FF8FB5;
  color:#fff;
  border:none;
  padding:14px 30px;
  border-radius:999px;
  font-size:17px;
  font-weight:700;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,135px);
  gap:14px;
}
.tem{
  background:#fff;
  border:none;
  border-radius:20px;
  padding:10px;
  box-shadow:0 6px 16px rgba(0,0,0,.08);
}
.tem img{
  width:100%;
  aspect-ratio:1;
  border-radius:14px;
  object-fit:cover;
}
.tem span{
  display:block;
  margin-top:8px;
  font-weight:600;
  color:#8A6C6C;
}
.flip-box{
  width:min(86vw,330px);
  aspect-ratio:1/1;
  perspective:1000px;
}
.flip{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:.8s;
}
.flip.rotate{transform:rotateY(180deg)}
.face{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 10px 24px rgba(0,0,0,.12);
}
.face.back{transform:rotateY(180deg)}
.face img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.frame{
  width:min(88vw,340px);
  aspect-ratio:1/1;
  background:#fff;
  border-radius:28px;
  overflow:hidden;
  position:relative;
  box-shadow:0 10px 24px rgba(0,0,0,.12);
}
#real{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  background:#fff;
}
#cover{
  position:absolute;
  inset:0;
  z-index:2;
}
#cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}
canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:3;
  touch-action:none;
}
.progress{
  width:min(88vw,340px);
  height:10px;
  background:#F3D8E4;
  border-radius:999px;
  margin-top:18px;
}
.fill{
  width:0;
  height:100%;
  background:#FF8FB5;
  border-radius:999px;
}
.card{
  width:min(88vw,340px);
  background:#fff;
  border-radius:24px;
  padding:18px;
  box-shadow:0 10px 24px rgba(0,0,0,.12);
  text-align:center;
}
.card img{
  width:100%;
  border-radius:18px;
  object-fit:contain;
  margin:12px 0 18px;
}
</style>
</head>

<body>

<section id="home" class="screen active">
  <h1>🎟️ Tem Phiếu Bí Mật</h1>
  <p>Một chiếc tem nhỏ dành riêng cho bé ✨</p>
  <button class="btn" onclick="show('choose')">Bắt đầu</button>
</section>

<section id="choose" class="screen">
  <h1 style="font-size:28px">Chọn 1 trong 5 tem</h1>
  <p>Bé chỉ được chọn một chiếc thôi 🌷</p>

  <div class="grid">
    <button class="tem" onclick="pick(1)"><img src="assets/cover.jpg"><span>Tem 01</span></button>
    <button class="tem" onclick="pick(2)"><img src="assets/cover.jpg"><span>Tem 02</span></button>
    <button class="tem" onclick="pick(3)"><img src="assets/cover.jpg"><span>Tem 03</span></button>
    <button class="tem" onclick="pick(4)"><img src="assets/cover.jpg"><span>Tem 04</span></button>
    <button class="tem" onclick="pick(5)"><img src="assets/cover.jpg"><span>Tem 05</span></button>
  </div>
</section>

<section id="flip" class="screen">
  <p>Chạm để lật tem ✨</p>

  <div class="flip-box">
    <div class="flip" id="flipCard" onclick="flipCard()">

      <div class="face front">
        <img src="assets/cover.jpg">
      </div>

      <div class="face back">
        <img src="assets/cover.jpg">
      </div>

    </div>
  </div>
</section>

<section id="scratch" class="screen">
  <p>Cào lớp bạc để mở quà 💖</p>

  <div class="frame">

    <img id="real">

    <div id="cover">
      <img src="assets/cover.jpg">
    </div>

    <canvas id="scratchCanvas"></canvas>

  </div>

  <div class="progress">
    <div class="fill" id="bar"></div>
  </div>
</section>

<section id="end" class="screen">
  <div class="card">
    <h2>  Tèng téng tèng tengg ✨ </h2>

    <img id="result">

    <button class="btn" onclick="restart()">Chơi lại</button>
  </div>
</section>

<script>
const DATA={
1:"assets/1.jpg",
2:"assets/2.jpg",
3:"assets/3.jpg",
4:"assets/4.jpg",
5:"assets/5.jpg"
};

let chosen=1;

function show(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

function pick(n){
 chosen=n;
 document.getElementById("flipCard").classList.remove("rotate");
 show("flip");
}

function flipCard(){
 document.getElementById("flipCard").classList.add("rotate");

 setTimeout(()=>{
   document.getElementById("real").src=DATA[chosen];
   document.getElementById("cover").style.display="block";
   show("scratch");
   initScratch();
 },650);
}

const canvas=document.getElementById("scratchCanvas");
const ctx=canvas.getContext("2d",{willReadFrequently:true});

function initScratch(){

 const rect=canvas.getBoundingClientRect();
 const dpr=window.devicePixelRatio||1;

 canvas.width=rect.width*dpr;
 canvas.height=rect.height*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);

 const g=ctx.createLinearGradient(0,0,rect.width,rect.height);
 g.addColorStop(0,"#D8D8D8");
 g.addColorStop(.5,"#F3F3F3");
 g.addColorStop(1,"#BEBEBE");

 ctx.globalCompositeOperation="source-over";
 ctx.fillStyle=g;
 ctx.fillRect(0,0,rect.width,rect.height);

 ctx.fillStyle="rgba(255,255,255,.25)";
 for(let i=0;i<200;i++){
   ctx.beginPath();
   ctx.arc(Math.random()*rect.width,Math.random()*rect.height,Math.random()*2+1,0,7);
   ctx.fill();
 }

 ctx.fillStyle="rgba(90,90,90,.35)";
 ctx.font="bold 22px sans-serif";
 ctx.textAlign="center";
 ctx.fillText("CÀO ĐI ✨",rect.width/2,rect.height/2);

 document.getElementById("bar").style.width="0%";
}

let drawing=false;
let last={x:0,y:0};

function getPos(e){
 const r=canvas.getBoundingClientRect();
 const p=e.touches?e.touches[0]:e;
 return{
   x:p.clientX-r.left,
   y:p.clientY-r.top
 };
}

canvas.onpointerdown=e=>{
 drawing=true;
 last=getPos(e);
 erase(last);
};

canvas.onpointermove=e=>{
 if(!drawing)return;
 const p=getPos(e);

 ctx.save();
 ctx.globalCompositeOperation="destination-out";
 ctx.lineCap="round";
 ctx.lineJoin="round";
 ctx.lineWidth=80;
 ctx.beginPath();
 ctx.moveTo(last.x,last.y);
 ctx.lineTo(p.x,p.y);
 ctx.stroke();
 ctx.restore();

 last=p;
 check();
};

window.onpointerup=()=>drawing=false;
window.onpointercancel=()=>drawing=false;

function erase(p){
 ctx.save();
 ctx.globalCompositeOperation="destination-out";
 ctx.beginPath();
 ctx.arc(p.x,p.y,40,0,Math.PI*2);
 ctx.fill();
 ctx.restore();
 check();
}

function check(){

 const img=ctx.getImageData(0,0,canvas.width,canvas.height).data;

 let clear=0;
 for(let i=3;i<img.length;i+=4){
   if(img[i]===0) clear++;
 }

 const total=img.length/4;
 const percent=Math.round(clear/total*100);

 document.getElementById("bar").style.width=percent+"%";

 if(percent>=45){

   ctx.clearRect(0,0,canvas.width,canvas.height);
   document.getElementById("cover").style.display="none";

   document.getElementById("result").src=DATA[chosen];

   setTimeout(()=>{
     show("end");
   },250);
 }
}

function restart(){
 show("home");
}
</script>

</body>
</html>
